# Min-bias 200 GeV following the sPHENIX PYTHIA minimum-bias configuration
# ($CALIBRATIONROOT/Generators/phpythia8_detroit_minBias.cfg):
#   SoftQCD:inelastic = on          -> non-diffractive + diffractive
#   ParticleDecays:tau0Max = 1e-7   -> generator decays only c*tau < 0.1 nm,
#                                      Geant4 decays everything longer-lived
process        = minbias
energy         = 200
tune           = nashville
stable_strange = 0
diffraction    = 1
max_lifetime   = 0.0000001
